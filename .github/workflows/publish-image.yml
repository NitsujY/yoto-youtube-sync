name: Publish container image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.worker
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ponytail: amd64 only — arm64 QEMU emulates apt/pip and turns uncached builds into 12-15min.
          # Add `platforms: linux/amd64,linux/arm64` back when someone actually pulls onto ARM.
          tags: ghcr.io/nitsujy/yoto-sync:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=yoto-sync
          cache-to: type=gha,mode=max,scope=yoto-sync
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/nitsujy/yoto-sync-worker:latest
          # ponytail: amd64 only, see above
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=yoto-sync-worker
          cache-to: type=gha,mode=max,scope=yoto-sync-worker
